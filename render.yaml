services:
  - name: ss2-backend
    type: web
    repo: https://github.com/kkingoftroll09/SS2_Final_Project
    branch: main
    rootDir: hotel_backend
    runtime: python
    buildCommand: python -c "import os, subprocess, sys; req = 'hotel_backend/requirements.txt' if os.path.exists('hotel_backend/requirements.txt') else 'requirements.txt'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-r', req])"
    startCommand: python -c "import os, runpy; target = 'hotel_backend/render_start.py' if os.path.exists('hotel_backend/render_start.py') else 'render_start.py'; runpy.run_path(target, run_name='__main__')"
    preDeployCommand: python -c "import os, runpy; target = 'hotel_backend/render_migrate.py' if os.path.exists('hotel_backend/render_migrate.py') else 'render_migrate.py'; runpy.run_path(target, run_name='__main__')"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ss2-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_CORS_ORIGINS
        value: https://ss2-final-project.onrender.com

  - name: ss2-frontend
    type: web
    runtime: static
    repo: https://github.com/kkingoftroll09/SS2_Final_Project
    branch: main
    rootDir: "frontend booking hotel management"
    buildCommand: echo "No build step"
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        value: https://ss2-final-project-backend.onrender.com

databases:
  - name: ss2-db
    databaseName: ss2_project
    user: ss2_user
